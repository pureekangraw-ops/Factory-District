name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Deploy Factory Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.147.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var SOURCE_SHA:${{ github.sha }}

      - name: Verify live Factory health and reject unsigned execution
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://factory-district.pureekangraw.workers.dev"
          # Cloudflare version propagation may briefly serve a previous SHA.
          # Only pass after independently seeing the freshly deployed commit.
          correct=0
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error "$BASE/health" > /tmp/factory-health.json
            if jq -e --arg sha "$EXPECTED_SHA" '.sourceSha==$sha and .runtimeSha==$sha' /tmp/factory-health.json >/dev/null; then correct=1; break; fi
            sleep 2
          done
          test "$correct" -eq 1
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const h = JSON.parse(readFileSync("/tmp/factory-health.json", "utf8"));
            const fail = (msg) => { throw new Error(msg); };
            if (h.service !== "factory-district" || h.stationId !== "FACTORY-STATION") fail("Factory identity mismatch");
            if (h.sourceSha !== process.env.EXPECTED_SHA || h.runtimeSha !== process.env.EXPECTED_SHA) fail("Live Factory source SHA mismatch");
            if (h.storage?.status !== "READY" || h.transport?.status !== "READY") fail("Factory storage/rail not ready");
            if (h.machinery?.LOGIC?.status !== "READY") fail("Factory LOGIC runner not ready");
            console.log(JSON.stringify({service:h.service,sourceSha:h.sourceSha,station:h.status,storage:h.storage.status,transport:h.transport.status,logic:h.machinery.LOGIC.status}));
          '
          UNSIGNED_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST "$BASE/station/receive")"
          case "$UNSIGNED_STATUS" in
            400|401|403) echo "Unsigned Factory dispatch rejected (HTTP $UNSIGNED_STATUS)" ;;
            *) echo "::error::Unsigned dispatch unexpected response HTTP $UNSIGNED_STATUS"; exit 1 ;;
          esac
