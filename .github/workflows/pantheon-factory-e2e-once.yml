name: Pantheon Factory live E2E (one-time)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-authorized-logic-trainee:
    if: contains(github.event.head_commit.message, 'E2E-PANTHEON-20261014')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test one WorkHub → Factory → D1 readback, revoke ephemeral credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          TOKEN="$(openssl rand -hex 48)"
          echo "::add-mask::$TOKEN"
          BASE="https://phatheon-workhub.pureekangraw.workers.dev"
          DELETE_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/phatheon-workhub/secrets/WORKHUB_SMOKE_TOKEN"
          created=0
          cleanup() {
            if [ "$created" -eq 1 ]; then
              response="$(curl --silent --show-error -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$DELETE_URL")" || true
              if echo "$response" | jq -e '.success == true' > /dev/null; then
                echo "Ephemeral WorkHub smoke credential revoked."
              else
                echo "::error::Could not confirm smoke secret deletion; manual Cloudflare cleanup required."
              fi
            fi
          }
          trap cleanup EXIT
          printf '%s' "$TOKEN" | npx --yes wrangler@4.147.0 secret put WORKHUB_SMOKE_TOKEN --name phatheon-workhub
          created=1
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --output /tmp/workhub-e2e-job.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              --data '{"request":"Authorized 2026-10-14 E2E: place DWARF-01 at LOGIC development bench; no external production authority"}' \
              "$BASE/v1/factory/jobs")"
            if [ "$status" = "201" ]; then break; fi
            if [ "$status" != "401" ] && [ "$status" != "503" ]; then
              echo "::error::Factory job create HTTP $status"; cat /tmp/workhub-e2e-job.json; exit 1
            fi
            sleep 3
          done
          test "$status" = "201"
          TASK_ID="$(jq -r '.task_id' /tmp/workhub-e2e-job.json)"
          echo "$TASK_ID" | grep -Eq '^task_[a-f0-9]{32}$'
          echo "Factory job created, explicit dispatch begins."
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" -X POST \
            "$BASE/v1/factory/jobs/$TASK_ID/dispatch" > /tmp/workhub-e2e-dispatch.json
          jq -e '.status=="COMPLETED" and .verified==true and (.result.evidenceRefs|length)>0 and (.receipt_id|startswith("receipt-"))' /tmp/workhub-e2e-dispatch.json > /dev/null
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
            "$BASE/v1/factory/jobs/$TASK_ID" > /tmp/workhub-e2e-readback.json
          jq -e '.job.status=="COMPLETED" and .job.task_status=="COMPLETED" and (.job.result_sha256|length)==64 and .job.result.domainVerified==true' /tmp/workhub-e2e-readback.json > /dev/null
          echo "Production E2E PASS: owner-scoped WorkHub -> Factory LOGIC trainee -> receipt -> verified readback -> D1."
          echo "TASK_ID=$TASK_ID"
